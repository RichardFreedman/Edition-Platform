---
layout: default
---

<h1>{{ page.title }}</h1>
<p>
  <strong>Composer:</strong> {{ page.composer }}<br>
  <strong>Editor:</strong> {{ page.editor }}<br>
  <a href="{{ site.baseurl }}/assets/mei/{{ page.mei_file }}" download>Download MEI file</a>
  &nbsp;|&nbsp;
  <button id="pdf-button" type="button" disabled>Download PDF</button>
</p>

<div id="controls" style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; margin: 1rem 0; padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 6px;">
  <div>
    <label for="scale-slider">Notation size: <span id="scale-value">40</span>%</label><br>
    <input type="range" id="scale-slider" min="10" max="150" step="5" value="40">
  </div>
  <div>
    <label for="tempo-slider">Tempo: <span id="tempo-value">100</span>%</label><br>
    <input type="range" id="tempo-slider" min="20" max="400" step="10" value="100">
  </div>
</div>

<div id="player-wrapper" style="margin-bottom: 1rem; display: none;">
  <midi-player id="midi-player" visualizer="#notation" sound-font></midi-player>
</div>

<div id="notation">Loading notation&hellip;</div>

<!-- Verovio: renders MEI -> SVG in the browser -->
<script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>

<!-- html-midi-player: plays MIDI derived from the MEI, no server needed -->
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>

<!-- jsPDF + svg2pdf.js: converts Verovio's rendered SVG pages into a downloadable PDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script>

<script>
  const meiUrl = "{{ site.baseurl }}/assets/mei/{{ page.mei_file }}";

  let vrvToolkit;
  let currentScale = 40;
  let currentTempoPct = 100;

  // Verovio's rendered SVG width is pageWidth * (scale / 100), so keep
  // pageWidth * scale constant as the slider changes — this way only the
  // size of the notes/staff changes, not the overall width of the notation.
  const BASE_PAGE_WIDTH = 1800;
  const BASE_SCALE = 40;
  const WIDTH_WORK = BASE_PAGE_WIDTH * BASE_SCALE;

  const scaleSlider = document.getElementById("scale-slider");
  const scaleValue = document.getElementById("scale-value");
  const tempoSlider = document.getElementById("tempo-slider");
  const tempoValue = document.getElementById("tempo-value");
  const midiPlayer = document.getElementById("midi-player");
  const pdfButton = document.getElementById("pdf-button");

  function renderNotation() {
    const pageWidth = Math.round(WIDTH_WORK / currentScale);
    vrvToolkit.setOptions({ pageWidth, scale: currentScale });
    vrvToolkit.redoLayout();
    document.getElementById("notation").innerHTML = vrvToolkit.renderToSVG(1);
  }

  function renderMidi() {
    vrvToolkit.setOptions({ midiTempoAdjustment: currentTempoPct / 100 });
    const base64Midi = vrvToolkit.renderToMIDI();
    const wasPlaying = midiPlayer.playing;
    if (wasPlaying) {
      midiPlayer.addEventListener("load", () => midiPlayer.start(), { once: true });
    }
    midiPlayer.src = "data:audio/midi;base64," + base64Midi;
  }

  async function downloadPdf() {
    pdfButton.disabled = true;
    const originalLabel = pdfButton.textContent;
    pdfButton.textContent = "Generating PDF…";

    try {
      // Render at a fixed, print-quality page size, independent of the
      // on-screen zoom slider, and let Verovio paginate the full piece.
      vrvToolkit.setOptions({ pageWidth: 2100, pageHeight: 2970, scale: 100, breaks: "auto" });
      vrvToolkit.redoLayout();

      const pageCount = vrvToolkit.getPageCount();
      const { jsPDF } = window.jspdf;
      let pdf;

      for (let i = 1; i <= pageCount; i++) {
        const container = document.createElement("div");
        container.style.position = "absolute";
        container.style.left = "-99999px";
        container.innerHTML = vrvToolkit.renderToSVG(i);
        document.body.appendChild(container);
        const svgEl = container.querySelector("svg");

        const widthPt = parseFloat(svgEl.getAttribute("width")) * 72 / 96;
        const heightPt = parseFloat(svgEl.getAttribute("height")) * 72 / 96;
        const orientation = widthPt > heightPt ? "landscape" : "portrait";

        if (i === 1) {
          pdf = new jsPDF({ orientation, unit: "pt", format: [widthPt, heightPt] });
        } else {
          pdf.addPage([widthPt, heightPt], orientation);
        }
        await pdf.svg(svgEl, { x: 0, y: 0, width: widthPt, height: heightPt });

        document.body.removeChild(container);
      }

      pdf.save("{{ page.mei_file | remove: '.mei' }}.pdf");
    } finally {
      // Restore the interactive, slider-driven view.
      renderNotation();
      pdfButton.textContent = originalLabel;
      pdfButton.disabled = false;
    }
  }

  pdfButton.addEventListener("click", downloadPdf);

  scaleSlider.addEventListener("input", (e) => {
    currentScale = Number(e.target.value);
    scaleValue.textContent = currentScale;
    renderNotation();
  });

  tempoSlider.addEventListener("input", (e) => {
    currentTempoPct = Number(e.target.value);
    tempoValue.textContent = currentTempoPct;
    renderMidi();
  });

  async function initVerovio() {
    vrvToolkit = new verovio.toolkit();

    const response = await fetch(meiUrl);
    const meiXml = await response.text();

    vrvToolkit.loadData(meiXml);
    renderNotation();
    renderMidi();

    document.getElementById("player-wrapper").style.display = "block";
    pdfButton.disabled = false;
  }

  // The wasm runtime can finish initializing before this script runs
  // (timing depends on network/cache speed), in which case
  // onRuntimeInitialized would be assigned too late and never fire.
  // Emscripten sets calledRun once the runtime is ready, so check it first.
  if (verovio.module.calledRun) {
    initVerovio();
  } else {
    verovio.module.onRuntimeInitialized = initVerovio;
  }
</script>
